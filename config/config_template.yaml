# --------------------------------------------------------------------------- #
# Metagenomics pipeline configuration — template                              #
# Copy this file to projects/<slug>/config.yaml and fill in the values marked #
# <REPLACE_ME>. Everything else carries a pipeline default tuned against the  #
# chicken_batch1 reference study; override per project as needed.             #
# --------------------------------------------------------------------------- #

study:
  id: <REPLACE_ME>                  # short slug used in output filenames (e.g. chicken_batch2)
  name: "<REPLACE_ME>"              # one-liner including primary contrast + date stamp
  description: >
    <REPLACE_ME — 2-3 lines explaining the contrast, the cohort, and any
    pipeline features this study exercises that the reference did not
    (random effect, controls, composite grouping, etc.).>

# Absolute path to the study's working directory on disk (the folder that
# contains Datasets/, Metadata/, Reports/). All other paths below are
# resolved relative to this root.
project_root: "<REPLACE_ME>"        # e.g. "C:/Users/.../PC_JC_2024-11-29_Julio_Gallus"

# --------------------------------------------------------------------------- #
# Input report locations (relative to project_root). Verify each path exists  #
# before first run — see bootstrap-project skill Step 1.                      #
# --------------------------------------------------------------------------- #
inputs:
  abricate_summary: "Reports/Abricate/summary_reportClean.csv"
  kraken2_report:   "Reports/Kraken2/kraken2_db1_combined_reports.txt"
  bracken_report:   "Reports/Kraken2/bracken_arranged.csv"     # may live under Reports/Bracken/ instead
  recentrifuge_csv: "Reports/Re-centrifuge/*.rcf.data.csv"     # glob allowed
  diversity_csv:    "Datasets/wf-metagenomics-diversity.csv"   # may live under Reports/wf-metagenomics/

# --------------------------------------------------------------------------- #
# Metadata                                                                    #
# --------------------------------------------------------------------------- #
metadata:
  file: "Metadata/<REPLACE_ME>.csv"  # the single CSV in Metadata/
  sample_id_col: "sample"            # usually `sample` (lowercase); NOT `sample_id`
  # Grouping variables. The first entry is the primary grouping (colour/x-axis
  # in violin/bar plots, contrast variable for ALDEx2 / PERMANOVA / DAA).
  group_cols:
    - <REPLACE_ME>                   # e.g. Treatment, or composite Treatment_Time
  random_effect: ~                   # column name for a clustering factor (block / pen / cage) or ~ if none
  fixed_effects:
    - <REPLACE_ME>                   # include group_cols[0] + continuous covariates (Weight, Age, ...)
  # Sample IDs to treat as negative controls — per-taxon counts are used as
  # the contaminant baseline and subtracted from real samples in R/02. Leave
  # empty (`controls: []`) for studies without controls; baseline subtraction
  # is skipped and a note is written to the run log. Declared controls that
  # don't match a post-strip rcf column cause a hard error.
  controls: []
  #   - CTRL1
  #   - CTRL2

# --------------------------------------------------------------------------- #
# Manual taxid / name fixes. Optional CSV with columns: taxid,name             #
# Set to ~ if the dataset has no fixes to apply.                              #
# --------------------------------------------------------------------------- #
taxid_fixes_file: "Metadata/taxid_fixes.csv"

# --------------------------------------------------------------------------- #
# Filter thresholds (tuned against chicken_batch1; adjust only if the dataset #
# is dramatically larger or smaller).                                         #
# --------------------------------------------------------------------------- #
filters:
  min_count_per_sample:   17        # original cleanData.R floor
  min_count_for_species:  500       # species count bar chart cutoff
  min_prevalence_aldex:   2         # ALDEx2 low-prevalence filter

# --------------------------------------------------------------------------- #
# Which analyses to run (false skips the stage).                              #
# --------------------------------------------------------------------------- #
stages:
  clean_data:             true
  normalisation:          true
  taxonomy:               true
  shared_fraction:        true      # species shared between groups, tiers, linkage (needs >= 2 groups)
  taxa_tree:              true      # circular taxonomic tree (NCBI lineage)
  relative_abundance:     true
  alpha_diversity:        true
  beta_diversity:         true
  differential_abundance: true
  resistome:              true
  virulome:               true
  mobilome:               true
  network:                true
  report:                 true
  panels:                 true      # publication panels + supplementary XLSX

# --------------------------------------------------------------------------- #
# Shared fraction of species between groups (R/04_shared_fraction.R) and the  #
# taxonomic tree (R/04_taxa_tree.R). Any number of groups.                    #
# --------------------------------------------------------------------------- #
shared_fraction:
  widespread_min_samples: 3     # widespread = in every group of its pattern:
  widespread_min_prev:    0.10  #   >= this many samples AND >= this prevalence
  heatmap_top_n:          30
  elements_min_reads:     2     # gene-species links with fewer reads are flagged low_support
  linkage_vars:           []    # metadata columns to link, e.g. [ward] or [ward, antibiotic_exposure]
  linkage_bins:           3     # numeric variables are binned into quantiles (low/mid/high)
  linkage_min_shared:     1     # minimum widespread species shared to draw an edge
  linkage_scope:          between   # between | within | all (groups)
  linkage_keep_na:        false
  linkage_test:           false # permutation test of edge weights (seed: stats.cluster_seed)
  linkage_n_perm:         999

taxa_tree:
  top_n:                  60    # most abundant species shown; widespread shared species always added
  min_samples:            2     # a tip must be detected in at least this many samples (all groups)

# --------------------------------------------------------------------------- #
# Statistical parameters (matches the chicken_batch1 manuscript).             #
# --------------------------------------------------------------------------- #
stats:
  permanova_permutations: 9999
  aldex_mc_samples:       128
  alpha: 0.05
  padjust_method: BH                # BH | BY | bonferroni | holm | hochberg | none
  # Patient/cluster-aware tests (R/utils_cluster_perm.R). When true AND
  # metadata.random_effect is set, KW / Wilcoxon / PERMANOVA / PERMDISP
  # p-values come from permutations that respect the clustering column
  # (labels shuffled within clusters if the group varies within them, whole
  # clusters shuffled otherwise), and ALDEx2 runs on counts pooled per
  # cluster (or cluster x group). Off by default so existing results are
  # unchanged.
  random_effect_tests: false
  # cluster_permutations: 9999      # defaults to permanova_permutations

# --------------------------------------------------------------------------- #
# Relative-abundance figures (R/05). Every key is optional; the values shown   #
# are the defaults. Override per project in projects/<slug>/config.yaml.       #
# --------------------------------------------------------------------------- #
# relative_abundance:
#   top_n: 15                # taxa shown (by mean per-sample %); rest -> "Others"
#   main_panel: group        # group | stream | sample - figure used by the fig05 panel
#                            #   (falls back group -> stream -> sample if it was not made)
#   group_order: null        # e.g. [Control, Low, High]; x order of the group bars
#                            #   and stream (default: alphabetical)
#   bar_axis_text_size: 12   # axis label pt (group bars shrink automatically when
#                            #   there are > 12 groups and the bars turn horizontal)
#   bar_legend_text_size: 12
#   per_sample:              # relative_abundance.png (one bar per sample)
#     enabled: auto          # auto | true | false  (true forces it past the limits)
#     max_samples: 40        # auto: skip above this many samples
#     layout: auto           # auto | "RxC" e.g. "1x2", "2x2", "3x2"
#                            #   auto = 1-2 groups 1x2, 3-4 groups 2x2, 5-6 groups 3x2;
#                            #   > 6 groups -> skipped (logged)
#     split_by: null         # metadata column: one relative_abundance_<level>.png per
#                            #   level (same taxa + colours), faceted by the group column

# --------------------------------------------------------------------------- #
# Quarto dashboard display caps. Statistics are always computed on the full   #
# unfiltered data — these only limit what plots / reactable tables show, so   #
# the report stays legible regardless of cohort size.                         #
# --------------------------------------------------------------------------- #
report:
  top_n_taxa:              25
  rank_taxa_by:            prevalence_x_abundance   # mean_abundance | prevalence | max_abundance | prevalence_x_abundance
  network_top_nodes:       50
  network_edge_min_weight: 0.3
  show_per_group_chord:    true
  show_per_group_sankey:   true

# --------------------------------------------------------------------------- #
# Tripartite network + sankey (R/12) display tuning. The full VF gene set     #
# (100+ genes in chicken_batch1) produces an unreadable diagram in print;     #
# capping at the top-30 by prevalence×abundance keeps the dominant flows.    #
# --------------------------------------------------------------------------- #
network:
  sankey:
    top_genes:  30
    rank_by:    prevalence_x_abundance              # mean_abundance | prevalence | prevalence_x_abundance

# --------------------------------------------------------------------------- #
# Publication panel rendering (R/13). All knobs are optional; defaults below  #
# match the final polishing pass applied to chicken_batch1.                   #
# --------------------------------------------------------------------------- #
panels:
  # Composite text scaling.
  composite_unified:     true       # force axis.text = axis.title = legend = one size
  composite_base_size:   8          # base text pt (axis title, text, strip, plot.tag)
  composite_legend_size: 8          # legend text pt
  composite_margin_pt:   6          # plot.margin pt on all sides
  strip_plot_title:      true       # drop per-plot title / subtitle so A/B/C tags lead
  show_title:            false      # journal figures get a caption, not a baked title
  # Output formats. PNG is the default container; TIFF + PDF are siblings.
  # Set png: false when you only need a publication TIFF.
  png:                   true
  tiff:                  false      # LZW-compressed 300-dpi TIFF for journal submission
  pdf:                   false      # cairo_pdf vector sibling

# --------------------------------------------------------------------------- #
# Output paths (relative to project_root). When evaluating a new dataset for  #
# the first time, prefix all four with `test_run/` to keep the original tree  #
# untouched.                                                                  #
# --------------------------------------------------------------------------- #
outputs:
  datasets_dir: "Datasets"
  figures_dir:  "Figures"
  report_html:  "Reports/pipeline_report.html"
  log_file:     "Reports/pipeline.log"
