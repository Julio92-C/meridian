name: container

# Builds the MERIDIAN analysis-layer image.
#  - Pull requests touching the container files  -> BUILD ONLY (validation, no push).
#  - Pushing a v* tag                            -> build AND push to ghcr.io.
#  - Manual dispatch                             -> build; push only if 'push' input is true.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - renv.lock
      - .github/workflows/container.yml
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      push:
        description: Push image to ghcr.io
        type: boolean
        default: false

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Bioconductor base + ~283-package renv restore is large; reclaim
      # runner disk so the build does not run out of space (~20 GB freed).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Decide whether to push
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "push" ] || \
             { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.push }}" = "true" ]; }; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to ghcr.io
        if: steps.gate.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/meridian
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=ref,event=pr
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build image (load into local docker)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Read-only runtime smoke test
        # Reproduces the Apptainer/Singularity read-only rootfs: renv must
        # activate and load keystone packages WITHOUT writing to the library.
        # The in-Dockerfile smoke check runs at build time (writable) and cannot
        # catch this — a broken run here means the image would fail on HPC.
        run: |
          IMG=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "Testing $IMG with a read-only rootfs..."
          docker run --rm --read-only --tmpfs /tmp -e HOME=/tmp \
            --entrypoint Rscript "$IMG" \
            -e "cat('libPaths:', .libPaths(), sep='\n'); library(ALDEx2); cat('READONLY OK\n')"

      - name: Push to ghcr.io (tags / dispatch only)
        if: steps.gate.outputs.push == 'true'
        run: |
          printf '%s\n' "${{ steps.meta.outputs.tags }}" | while read -r t; do
            [ -n "$t" ] && echo "pushing $t" && docker push "$t"
          done
