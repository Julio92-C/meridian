study:
  id: test_real_data
  name: "Smoke test against real chicken_batch1 data"
  description: >
    Test config for verifying the pipeline against the real Gallus caecum
    dataset. Reads inputs from the original project_root but writes every
    output under test_run/ so existing analysis files are never overwritten.

project_root: "C:/Users/julio/Desktop/PC_JC_2024-11-29_Julio_Gallus"

inputs:
  abricate_summary: "Reports/Abricate/summary_reportClean.csv"
  kraken2_report:   "Reports/Kraken2/kraken2_db1_combined_reports.txt"
  bracken_report:   "Reports/Kraken2/bracken_arranged.csv"
  recentrifuge_csv: "Reports/Re-centrifuge/*.rcf.data.csv"
  diversity_csv:    "Datasets/wf-metagenomics-diversity.csv"

metadata:
  file: "Datasets/chicken_metadata1.csv"   # clean version (no blank rows)
  sample_id_col: "sample"
  group_cols:
    - Treatment
  # chicken_batch1 has no random effect / Weight column; leaving these
  # placeholders here for now — downstream stages may need similar
  # optional handling once they are reworked.
  random_effect: ~
  fixed_effects: [Treatment]
  controls: []                              # no negative controls in this study

taxid_fixes_file: "Metadata/taxid_fixes.csv"

filters:
  min_count_per_sample:   17
  min_count_for_species:  500
  min_prevalence_aldex:   2

stages:
  clean_data:             true
  normalisation:          true
  taxonomy:               true
  relative_abundance:     true
  alpha_diversity:        true
  beta_diversity:         true
  differential_abundance: true
  resistome:              true
  virulome:               true
  mobilome:               true
  network:                true
  report:                 true

stats:
  permanova_permutations: 9999
  aldex_mc_samples:       128
  alpha: 0.05

# Display caps for the Quarto dashboard. Statistics are always computed on
# unfiltered data — these only limit what plots and reactable tables show
# so the report stays readable regardless of project size.
report:
  top_n_taxa:              25     # composition stacked bar / heatmap / table
  top_n_genes:             30     # resistome / virulome / mobilome / DAA gene
  rank_taxa_by:            prevalence_x_abundance   # mean_abundance | prevalence | max_abundance | prevalence_x_abundance
  other_bucket:            true   # collapse remainder into "Others" in stacked bars
  daa_extra:               significant   # always include sig features beyond top-N
  network_top_nodes:       50     # hub cap for topology / gephi cards
  network_edge_min_weight: 0.3    # display threshold for gephi edges
  show_per_group_chord:    true
  show_per_group_sankey:   true

outputs:
  datasets_dir: "test_run/Datasets"
  figures_dir:  "test_run/Figures"
  report_html:  "test_run/Reports/pipeline_report.html"
  log_file:     "test_run/Reports/pipeline.log"
