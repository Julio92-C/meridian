study:
  id: lung_microbiome
  name: "Lung microbiome — EBSP / UCLH (3-batch combined)"
  description: >
    Exhaled-breath (EB) vs sputum (SP) microbiome of immunocompromised
    patients seen at the Royal Free Hospital. Combines three ONT sequencing
    batches (JC_PC_2025-04-11, JC_PC_2025-05-13, JC_2025-06-18) via
    projects/lung_microbiome/combine_batches.R into single pipeline-ready
    reports under metaOmics/Reports/. Sample IDs reconciled across batches
    using sequence_info.xlsx patient-ID lookup; counts summed across
    batches for the 6 re-sequenced samples (SP-16/15/03/10, EB-23, EB-17).
    Outputs land under test_run/ so the merged Reports/ tree is untouched.

project_root: "C:/Users/julio/Desktop/Lung_microbiome/metaOmics"

inputs:
  abricate_summary: "Reports/Abricate/summary_reportClean.csv"
  # NOTE: kraken2 lives under Reports/Kraken/ (not Kraken2/ like chicken_batch1)
  kraken2_report:   "Reports/Kraken/kraken2_db1_combined_reports.txt"
  # NOTE: bracken lives under Reports/Bracken/ (chicken_batch1 had it under Reports/Kraken2/)
  bracken_report:   "Reports/Bracken/bracken_arranged.csv"
  recentrifuge_csv: "Reports/Re-centrifuge/EBSP_samples.rcf.data.csv"
  # Precomputed wf-metagenomics diversity is left null: it uses a different
  # taxonomic classifier than Bracken AND has NA for the 6 re-sequenced
  # samples that cannot be re-summed at the metric level. R/06 will compute
  # all 51 samples uniformly from the combined Bracken counts instead.
  # The combined file lives at Reports/wf-metagenomics/wf-metagenomics-diversity.csv
  # if you ever want to switch to precomputed.
  diversity_csv:    ~

metadata:
  file: "Metadata/sample_metadata.csv"
  sample_id_col: "sample"
  group_cols:
    - sample_type                     # Exhale | Sputum (Control rows stripped by R/02 via `controls` list).
                                      # Renamed from "type" to avoid a collision with R/12_network.R's
                                      # internal `nodes$type` column (sample/taxa/gene kind), which
                                      # otherwise drops the grouping after the sample_meta left-join.
  random_effect: "ID"                 # patient ID — many patients contribute >1 sample
  fixed_effects:
    - sample_type
  # Per-batch baseline subtraction is performed upstream in
  # combine_batches.R (BATCH_CONTROLS const) so that April's NC-19 only
  # filters April samples, May's NC-10/NC-13 only filter May samples, and
  # June's NC-22/NC-30 only filter June samples. The 5 control rows
  # (NC-10, NC-13, NC-19, NC-22, NC-30) have also been removed from
  # sample_metadata.csv so R/14 reports the correct 46 analysis samples
  # and group_levels = [Exhale, Sputum]. `controls` left empty because
  # there's nothing for R/02 / R/06 / R/14 to do — the upstream-tolerant
  # path in R/02 (declared-but-rcf-absent → skip filter) is still
  # available if you ever want to restore the list for documentation.
  controls: []

# No manual taxid/name fixes for this study.
taxid_fixes_file: ~

filters:
  min_count_per_sample:   17
  min_count_for_species:  500
  min_prevalence_aldex:   2

stages:
  clean_data:             true
  normalisation:          true
  taxonomy:               true
  relative_abundance:     true
  alpha_diversity:        true
  beta_diversity:         true
  differential_abundance: true
  resistome:              true
  virulome:               true
  mobilome:               true
  network:                true
  report:                 true
  panels:                 true

stats:
  permanova_permutations: 9999
  aldex_mc_samples:       128
  alpha: 0.05

report:
  top_n_taxa:              25
  rank_taxa_by:            prevalence_x_abundance
  network_top_nodes:       50
  network_edge_min_weight: 0.3
  show_per_group_chord:    true
  show_per_group_sankey:   true

# Centralised palette for any categorical metadata variable. Picked up by
# every stage's group-palette resolver (R/04-R/11), so Exhale/Sputum get
# the same colors in alpha-violin, beta-PCoA, DA effect plots, and the
# resistome/virulome/mobilome bars.
colors:
  sample_type:
    Exhale: "#1F77B4"   # colorblind-safe blue
    Sputum: "#FF7F0E"   # colorblind-safe orange

# Per-project R/04 pheatmap fontsize for the species heatmap. R/13 scales
# the source PNG down into the figS00_heatmap_species supplementary cell,
# so lung's denser data needs larger at-source fonts to remain legible
# after the scale-down. Bumped from defaults 8/8/10.
taxonomy:
  heatmap_fontsize_row:  17   # row labels (species names)
  heatmap_fontsize_col:  15   # column labels (sample IDs)
  heatmap_fontsize_base: 17   # legend + annotation_legend font

# Per-project R/05 stacked-bar fontsize for the standalone species bar. R/13
# scales the source PNG down into the fig05_relative_abundance_species cell;
# at lung's 42-sample width that scale-down crushes the default 12pt x-axis
# labels. Smaller at-source size keeps EB-* / SP-* sample IDs legible.
relative_abundance:
  bar_axis_text_size:   5.5  # x-axis sample labels (default 12)
  bar_legend_text_size: 4    # legend text (default 12; moot in composite — see panels.slot_overrides below)

# Per-VFDB sankey filter (R/12). Trims the noisy long tail before
# rendering so the diagram tells a story about the top virulence drivers.
network:
  sankey:
    top_genes:           20                        # keep top-N genes by rank score
    min_gene_prevalence: 0.15                      # drop genes present in <15% of samples
    rank_by:             prevalence_x_abundance    # mean_abundance | prevalence | prevalence_x_abundance

# Publication panel rendering — unified fontsize across every composite cell
# (8pt text + legend). Raster sources (pheatmap / Venn / UpSet / circlize)
# are shrunk at the per-stage modules; ggplot panels obey these knobs via
# R/13_panels.R::.panels_composite_theme.
panels:
  composite_unified:    true
  composite_base_size:  8
  composite_legend_size: 6
  composite_margin_pt:  6
  strip_plot_title:     true
  show_title:           false
  # Publication output: TIFF (LZW-compressed, 300 dpi). PNG suppressed for
  # the panel composites since they're not embedded in the Quarto report;
  # per-stage figures under <figures_dir>/<stage>/*.png remain PNG.
  tiff:                 true
  png:                  false

  # Per-slot overrides (R/13_panels.R::run_panels merges this onto the
  # shared templates/frontiers_v2_slots.yaml via modifyList — scoped to
  # lung only, other projects keep reading the unmodified template).
  #
  # figS00_heatmap_species: raster (pheatmap), so composite theme/overrides
  # don't touch it (see .panels_build_section_grid's raster branch) — the
  # only lever is canvas size. Default 1-panel slot canvas is 5.5x4.9in;
  # lung's 46-species x 42-sample heatmap needs more room than that to
  # show off the bumped fontsize_row/col/base (17/15/17 in taxonomy:).
  #
  # fig05_relative_abundance_species: native ggplot, so the shared slot's
  # own composite.legend_text_size (5pt in the template) wins over both
  # composite_legend_size above AND relative_abundance.bar_legend_text_size
  # below (same theme key, last writer wins — see R/13_panels.R:535-541).
  # Override it here directly rather than fighting that via R/05's knob.
  slot_overrides:
    supplementary:
      figS00_heatmap_species:
        width_in:  10
        height_in: 9
    main:
      fig05_relative_abundance_species:
        width_in:  9
        height_in: 7.5
        composite:
          legend_text_size:   5
          legend_nrow:        20
          legend_key_size_cm: 0.2

outputs:
  datasets_dir: "test_run/Datasets"
  figures_dir:  "test_run/Figures"
  report_html:  "test_run/Reports/pipeline_report.html"
  log_file:     "test_run/Reports/pipeline.log"
