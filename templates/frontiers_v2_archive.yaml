# Publication panel layout — Frontiers in Microbiology v2 layout.
# Codified from the v2 layout table in docs/PIPELINE_V2_GAPS.md.
#
# Schema:
#   main / supplementary:
#     <slot_slug>:
#       title:  one-line title rendered above the composed figure
#       rows:   grid rows
#       cols:   grid cols
#       panels: ordered list (left-to-right, top-to-bottom)
#         - tag:    "A" | "B" | "C" | "D" (auto-assigned if omitted)
#           kind:   manifest `kind` to match
#           domain: optional filter (e.g. "resistome" / "virulome" / "mobilome" / "taxa")
#           metric: optional filter for alpha_violin / alpha_bar
#           pair:   optional 2-element list filter for aldex2_maplot
#           organism: optional filter for species_count_genmap
#           rank:   optional taxonomic rank filter
#           required: true (default) — slot skipped if missing; false — panel just absent
#
# Resolution rule: the first manifest entry matching all specified
# (kind, domain, metric, pair, organism, rank) filters wins. Filters
# that aren't specified are wildcards.

main:
  fig01_study_overview:
    title: "Study overview and QC"
    rows: 1
    cols: 2
    panels:
      - tag: A
        kind: study_design_schematic
        required: false
      - tag: B
        kind: rarefaction_curves

  fig02_alpha_diversity:
    title: "Alpha diversity across treatments"
    rows: 2
    cols: 2
    panels:
      - tag: A
        kind: alpha_violin
        metric: "Richness"
      - tag: B
        kind: alpha_violin
        metric: "Shannon diversity index"
      - tag: C
        kind: alpha_violin
        metric: "Chao1 estimator"
      - tag: D
        kind: alpha_violin
        metric: "Simpson's index"

  fig03_beta_diversity:
    title: "Beta diversity and community structure"
    rows: 1
    cols: 2
    panels:
      - tag: A
        kind: pcoa_scatter
      - tag: B
        kind: pcoa_jaccard

  fig04_taxa_composition:
    title: "Taxonomic composition"
    rows: 2
    cols: 2
    panels:
      - tag: A
        kind: composition_stacked_bar
      - tag: B
        kind: taxa_heatmap
        required: false
      - tag: C
        kind: genus_heatmap

  fig05_differential_abundance:
    title: "Differential abundance (ALDEx2)"
    rows: 2
    cols: 2
    panels:
      - tag: A
        kind: aldex2_maplot
        domain: taxa
        pair: ["Dulce", "Reference_diet"]
        required: false
      - tag: B
        kind: aldex2_maplot
        domain: taxa
        pair: ["Dulce", "Soyabean_meal"]
        required: false
      - tag: C
        kind: aldex2_maplot
        domain: taxa
        pair: ["Reference_diet", "Soyabean_meal"]
        required: false
      - tag: D
        kind: aldex2_dotplot
        required: false

  fig06_resistome_diversity:
    title: "Resistome diversity and ordination"
    rows: 2
    cols: 2
    panels:
      - tag: A
        kind: ge_alpha_richness_violin
        domain: resistome
      - tag: B
        kind: ge_alpha_shannon_violin
        domain: resistome
      - tag: C
        kind: ge_drug_total_count
        domain: resistome
      - tag: D
        kind: ge_pcoa
        domain: resistome

  fig07_resistome_composition:
    title: "Resistome composition"
    rows: 2
    cols: 2
    panels:
      - tag: A
        kind: ge_pheatmap_genes
        domain: resistome
      - tag: B
        kind: arg_upset
      - tag: C
        kind: arg_circos

  fig08_virulome_mobilome:
    title: "Virulome and mobilome profiles"
    rows: 2
    cols: 2
    panels:
      - tag: A
        kind: ge_vf_total_count
        domain: virulome
      - tag: B
        kind: ge_mge_family_total_count
        domain: mobilome
      - tag: C
        kind: ge_mge_relative_abundance
        domain: mobilome
      - tag: D
        kind: vf_arg_corr_heatmap

  fig09_network:
    title: "ARG–taxa co-occurrence network"
    rows: 1
    cols: 2
    panels:
      - tag: A
        kind: network_graph
      - tag: B
        kind: degree_distribution

  fig10_multiomics_integration:
    title: "Multi-omic integration"
    rows: 2
    cols: 2
    panels:
      - tag: A
        kind: sankey_taxon_arg_mge
        required: false
      - tag: B
        kind: mantel_triangle
      - tag: C
        kind: mobile_fraction_bar
        required: false

