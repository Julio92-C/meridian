# Publication panel layout — composite + standalone main panels.
# Designed 2026-06-12 with the user. Supersedes the Frontiers literal
# v2 layout in templates/frontiers_v2_archive.yaml.
#
# Two slot kinds:
#
# 1. Composite "diversity overview" — one per omics layer (taxa, ARG, VF,
#    MGE). Bold A-F tags. Up to six sub-panels:
#       A: alpha-diversity richness violin
#       B: alpha-diversity Shannon violin
#       C: beta-diversity PCoA (Bray-Curtis)
#       D: relative-abundance composition at the layer's category level
#          (class for taxa, drug class for ARG, function for VF, replicon
#          family for MGE)
#       E: abundance dot plot (TPM total × prevalence, category-level)
#       F: UpSet plot of treatment-shared / treatment-unique categories
#    Sub-panels that don't have a matching manifest kind for the layer
#    are marked required:false and skipped cleanly (e.g. taxa has no
#    UpSet kind currently, so taxa composite is A-E).
#
# 2. Standalone "no-label" panels — one figure per slot, single-panel,
#    NO A/B/C/D tag, full-width. Used for figures that don't benefit
#    from sub-panel composition (relative-abundance stacked bar at
#    species level, heatmaps, chord, sankey, network). Marked with
#    `labels: false` so the resolver skips tag assignment.
#
# Schema:
#   main:
#     <slot_slug>:
#       title:  italic title rendered above the figure
#       rows:   grid rows
#       cols:   grid cols
#       labels: true (default) | false  — set false for standalone panels
#       panels: ordered list
#         - tag: "A" ... (auto-assigned A,B,C... if omitted)
#           kind: manifest `kind` to match
#           domain | metric | pair | organism | rank: optional filters
#           required: true (default) | false  — false = skip silently if missing
#
# First manifest entry matching all (kind + specified filters) wins.

main:

  # ---------------------------------------------------------------------
  # Composite overviews — one per omics layer (4 panels, A-F)
  # ---------------------------------------------------------------------

  fig01_taxa_overview:
    title: "Taxonomic diversity overview"
    subsection: community_overview
    rows: 2
    cols: 3
    labels: true
    panels:
      - tag: A
        kind: alpha_violin
        metric: "Richness"
        # Source bakes in legend.position = "top"; at composite scale it
        # stacks with the top-right KW p-value annotation. Drop the legend
        # here — panel C (PCoA) carries the Treatment_Bird colour key for
        # the whole composite.
        composite:
          legend_position: none
      - tag: B
        kind: alpha_violin
        metric: "Shannon diversity index"
        composite:
          legend_position: none
      - tag: C
        kind: pcoa_scatter
      - tag: D
        # Venn (3-set treatment) replaces UpSet for taxa per 2026-06-12
        # design call — taxa has no UpSet kind, and Venn reads cleanly with
        # 3 treatment groups.
        kind: venn
      - tag: E
        kind: species_prevalence
        required: false
      - tag: F
        # Per-treatment smoothed area at CLASS level — coarser taxonomic
        # rank reads cleaner at composite scale than species-level (where
        # 50+ categories pile up). The standalone species stream lives
        # in fig05.
        kind: composition_stream
        rank: class

  fig02_resistome_overview:
    title: "Resistome (ARG) diversity overview"
    subsection: resistome
    rows: 2
    cols: 3
    labels: true
    panels:
      - tag: A
        kind: ge_alpha_richness_violin
        domain: resistome
      - tag: B
        kind: ge_alpha_shannon_violin
        domain: resistome
      - tag: C
        kind: ge_pcoa
        domain: resistome
      - tag: D
        kind: arg_upset
      - tag: E
        kind: ge_drug_count_prevalence
        domain: resistome
      - tag: F
        kind: ge_drug_stream_abundance
        domain: resistome

  fig03_virulome_overview:
    title: "Virulome (VF) diversity overview"
    subsection: virulome
    rows: 2
    cols: 3
    labels: true
    panels:
      - tag: A
        kind: ge_alpha_richness_violin
        domain: virulome
      - tag: B
        kind: ge_alpha_shannon_violin
        domain: virulome
      - tag: C
        kind: ge_pcoa
        domain: virulome
      - tag: D
        kind: vf_upset
      - tag: E
        kind: ge_vf_count_prevalence
        domain: virulome
      - tag: F
        kind: ge_vf_stream_abundance
        domain: virulome

  fig04_mobilome_overview:
    title: "Mobilome (plasmid replicon) diversity overview"
    subsection: mobilome
    rows: 2
    cols: 3
    labels: true
    panels:
      - tag: A
        kind: ge_alpha_richness_violin
        domain: mobilome
      - tag: B
        kind: ge_alpha_shannon_violin
        domain: mobilome
      - tag: C
        kind: ge_pcoa
        domain: mobilome
      - tag: D
        kind: mge_upset
      - tag: E
        # Gene-level prevalence (IncF, IncX, ColE1, ...) per the 2026-06-12
        # design call. Family-level kept for supplementary if needed.
        kind: ge_mge_count_prevalence
        domain: mobilome
      - tag: F
        kind: ge_mge_stream_abundance
        domain: mobilome

  # ---------------------------------------------------------------------
  # Standalone panels — no A/B/C tags, single full-width figure each.
  # Granularity: species (taxa) → gene functions (category) → individual genes.
  # ---------------------------------------------------------------------

  # --- Relative abundance ----------------------------------------------
  fig05_relative_abundance_species:
    title: "Relative abundance — species composition"
    subsection: community_overview
    rows: 1
    cols: 1
    labels: false
    # Keep the 50-species legend at top but shrink hard: 5pt text + 0.2cm
    # key swatch, 15 rows so it wraps to ~4 narrow columns and fits the
    # 5.5" composite cell width without clipping names.
    composite:
      legend_position: top
      legend_nrow: 15
      legend_text_size: 5
      legend_key_size_cm: 0.2
    panels:
      - kind: composition_stacked_bar

  # fig06-08 (per-domain RA standalones for ARG / VF / MGE genes) and
  # fig10-12 (per-domain category-level heatmaps) removed 2026-06-12.
  # Their content lives in figS_diet_effects_{arg,vf,mge} panels A and
  # E respectively, so keeping them in main duplicates the figure budget.
  # Taxa species RA (fig05) and taxa species heatmap (fig06) stay in
  # main as the taxa story doesn't have a diet-effects supplementary
  # of its own.

  # Taxa species heatmap moved to supplementary 2026-06-12 (sits beside
  # the gene-level heatmaps there). The taxa diversity / composition
  # story in main is carried by fig01 composite + fig05 species RA.

  # --- Chord, Sankey, Network ------------------------------------------
  fig06_chord:
    title: "Chord diagram — overall ARG–taxa flow"
    subsection: taxa_gene_associations
    rows: 1
    cols: 1
    labels: false
    panels:
      - kind: chord

  fig07_sankey_vf:
    title: "Sankey — VF taxa-to-function flow"
    subsection: taxa_gene_associations
    rows: 1
    cols: 1
    labels: false
    # Shrink both legend and axis text further so all 7 categories fit on
    # 2 rows and the "Sample/Taxon/Gene/Category" column heads stay
    # readable at composite scale.
    composite:
      legend_text_size: 5
      legend_key_size_cm: 0.25
      axis_text_size: 7
    panels:
      - kind: sankey_png

  fig08_sankey_taxon_arg_mge:
    title: "Sankey — phylum → ARG drug class → MGE replicon family"
    subsection: taxa_gene_associations
    rows: 1
    cols: 1
    labels: false
    panels:
      - kind: sankey_taxon_arg_mge
        required: false

  fig09_network:
    title: "Tripartite network — sample × taxon × gene element"
    subsection: co_occurrence_network
    rows: 1
    cols: 1
    labels: false
    # ggraph's layout sets x/y aesthetics; theme_void() blanks them at the
    # source but the composite theme re-adds axis.title/axis.text. Strip
    # everything axis-related so the composite stays clean.
    composite:
      strip_axis_text: all
    panels:
      - kind: network_graph

  fig10_vf_arg_correlation:
    title: "Cross-domain VF × ARG correlation heatmap"
    subsection: co_occurrence_network
    rows: 1
    cols: 1
    labels: false
    panels:
      - kind: vf_arg_corr_heatmap

supplementary:

  # =============================================================
  # Diet effects on gene elements (GEs) across treatments
  # =============================================================
  # Three per-domain supplementary composites (ARG / VF / MGE),
  # each 5-panel (A-E) tall layout:
  #   A relative abundance per sample (stacked bar)
  #   B TPM x prevalence dot plot
  #   C treatment-overlap Venn
  #   D abundance log(TPM) box+jitter w/ pairwise asterisks
  #   E heatmap (drug class / VF function / replicon family)

  # 2x2 flat layout (2026-06-12 follow-up). The Venn was dropped from
  # this composite — treatment overlap is also visible in the main
  # composite UpSet panels, and removing it lets the remaining four
  # panels each occupy a full quadrant.

  figS_diet_effects_arg:
    title: "Diet effects on antibiotic resistance genes (ARGs) across treatments"
    subsection: resistome
    rows: 2
    cols: 2
    labels: true
    panels:
      - tag: A
        kind: ge_drug_relative_abundance
        domain: resistome
        # Panel B (right) labels every drug class on its y-axis with its
        # Total TPM, so it already serves as a legend for panel A's bars.
        composite:
          legend_position: none
      - tag: B
        kind: ge_drug_total_count
        domain: resistome
      - tag: C
        kind: ge_arg_abundance_violin
        domain: resistome
      - tag: D
        kind: ge_pheatmap_drug_classes
        domain: resistome

  figS_diet_effects_vf:
    title: "Diet effects on virulence factors (VFs) across treatments"
    subsection: virulome
    rows: 2
    cols: 2
    labels: true
    panels:
      - tag: A
        kind: ge_vf_relative_abundance
        domain: virulome
        composite:
          legend_position: none
      - tag: B
        kind: ge_vf_total_count
        domain: virulome
      - tag: C
        kind: ge_vf_abundance_violin
        domain: virulome
      - tag: D
        kind: ge_pheatmap_functions
        domain: virulome

  figS_diet_effects_mge:
    title: "Diet effects on plasmid replicons (MGEs) across treatments"
    subsection: mobilome
    rows: 2
    cols: 2
    labels: true
    panels:
      - tag: A
        kind: ge_mge_relative_abundance
        domain: mobilome
        composite:
          legend_position: none
      - tag: B
        kind: ge_mge_total_count
        domain: mobilome
      - tag: C
        kind: ge_mge_abundance_violin
        domain: mobilome
      - tag: D
        # Gene-level heatmap per the 2026-06-12 MGE design call.
        kind: ge_pheatmap_genes
        domain: mobilome

  # =============================================================
  # Gene-level pheatmaps (legacy supplementary slots) — full-detail
  # per-gene rendering. Moved here from main 2026-06-12.
  # =============================================================

  figS00_heatmap_species:
    title: "Heatmap — top species"
    subsection: community_overview
    rows: 1
    cols: 1
    labels: false
    panels:
      - kind: taxa_heatmap

  figS00b_network_degree_distribution:
    title: "Network degree distribution"
    subsection: co_occurrence_network
    rows: 1
    cols: 1
    labels: false
    # Legend on top frees horizontal canvas for the long x-axis label list;
    # shrink the rotated taxon/gene names further so they don't run into
    # each other at composite scale.
    composite:
      legend_position: top
      legend_text_size: 7
      axis_text_size: 2
    panels:
      - kind: degree_distribution

  figS00c_rarefaction_curves:
    title: "Rarefaction curves"
    subsection: community_overview
    rows: 1
    cols: 1
    labels: false
    panels:
      - kind: rarefaction_curves

  figS01_heatmap_arg_genes:
    title: "Heatmap — individual ARG genes"
    subsection: resistome
    rows: 1
    cols: 1
    labels: false
    panels:
      - kind: ge_pheatmap_genes
        domain: resistome

  figS02_heatmap_vf_genes:
    title: "Heatmap — individual VF genes"
    subsection: virulome
    rows: 1
    cols: 1
    labels: false
    panels:
      - kind: ge_pheatmap_genes
        domain: virulome

  # figS03_heatmap_mge_genes removed 2026-06-12 — fig12_heatmap_mge_replicon
  # in main: now covers the plasmid-replicon gene heatmap. The family-level
  # heatmap (ge_pheatmap_replicon_families) is still emitted by R/11 and
  # available if a future supplementary slot wants it.

  # =============================================================
  # Circos (ARG drug class) + per-treatment chord diagrams.
  # Added 2026-06-16 to free main of the per-treatment chord trio and
  # the standalone ARG circos. fig06_chord (main) still carries the
  # overall chord. 2x2 layout: circos top-left + 3 treatment chords.
  # =============================================================
  figS_circos_chord_by_treatment:
    title: "ARG drug-class circos and per-treatment taxon co-occurrence chords"
    subsection: taxa_gene_associations
    rows: 2
    cols: 2
    labels: true
    panels:
      - tag: A
        kind: arg_circos
        domain: resistome
      # Per-treatment taxon co-occurrence chords. Adapts to the number of
      # levels in cfg$metadata$group_cols[[1]]: 3 panels (B/C/D) for the
      # chicken_batch1 3-arm design, 2 panels (B/C) for the lung 2-arm
      # design, etc. R/14_panels.R::.panels_expand_per_group fans this out
      # at runtime and sanitises level names to match the underlying
      # chord_<group>.png filenames written by R/12_network.R.
      - kind: chord
        per_group: true
